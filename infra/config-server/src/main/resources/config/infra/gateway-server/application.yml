server:
  port: 8080

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/categories/**,/admin/categories/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests,/users/*/requests/*/cancel,/users/*/events/*/requests

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**,/admin/comments/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**,/admin/events/**,/users/{userId}/events,/users/{userId}/events/{eventId},/compilations/**,/admin/compilations/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway