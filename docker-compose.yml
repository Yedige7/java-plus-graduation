services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats

  ewm-db:
    image: postgres:16.1
    container_name: postgres-ewm-main-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: main
      POSTGRES_PASSWORD: main
    volumes:
      - ./docker/init-ewm-dbs.sql:/docker-entrypoint-initdb.d/01-init-ewm-dbs.sql
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: ewm-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: ewm-kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
              'kafka-topics --create --topic stats.user-actions.v1 \
                           --partitions 3 --replication-factor 1 --if-not-exists \
                           --bootstrap-server kafka:29092 && \
              kafka-topics --create --topic stats.events-similarity.v1 \
                           --partitions 3 --replication-factor 1 --if-not-exists \
                           --bootstrap-server kafka:29092 && \
              kafka-topics --list --bootstrap-server kafka:29092'"
